<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen()">
  <app-loading-overlay [loading]="navigating()" message="Loading page…" />
  <app-sidebar [collapsed]="!sidebarOpen()" (toggleSidebar)="toggleSidebar()" />
  @if (!sidebarOpen()) {
    <button
      type="button"
      class="sidebar-reopen"
      (click)="toggleSidebar()"
      aria-label="Show navigation"
      title="Show navigation"
    >
      <img
        class="sidebar-reopen-logo"
        src="/images/aps-logo.png"
        alt=""
        width="28"
        height="28"
        aria-hidden="true"
      />
      <span class="sidebar-reopen-icon" aria-hidden="true">☰</span>
    </button>
  }
  <main class="app-content">
    <router-outlet />
  </main>
</div>

@if (showWelcomeSplash()) {
  <app-welcome-splash (finished)="onWelcomeSplashFinished()" />
}

@if (showCompanySetup()) {
  <app-company-setup-modal (completed)="onCompanySetupCompleted()" />
}
